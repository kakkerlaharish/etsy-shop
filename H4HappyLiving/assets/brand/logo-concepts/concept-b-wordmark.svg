<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" role="img" aria-labelledby="title desc">
  <title id="title">H4HappyLiving Shift wordmark concept</title>
  <desc id="desc">A typography-led wordmark with an emphasized H4 and four rhythmic accents.</desc>
  <rect width="820" height="180" rx="24" fill="#FFF9F1"/>
  <g font-family="Nunito Sans, Avenir Next, Arial, sans-serif" font-weight="800" letter-spacing="-3">
    <text x="54" y="108" fill="#285247" font-size="72">H</text>
    <text x="108" y="96" fill="#E77B68" font-size="72">4</text>
    <text x="159" y="108" fill="#24332F" font-size="64">HappyLiving</text>
  </g>
  <g transform="translate(58 130)">
    <rect width="36" height="8" rx="4" fill="#F2B84B"/>
    <rect x="44" width="36" height="8" rx="4" fill="#77AFC2"/>
    <rect x="88" width="36" height="8" rx="4" fill="#E77B68"/>
    <rect x="132" width="36" height="8" rx="4" fill="#7FAE74"/>
  </g>
</svg>
