    <text x="98" y="277" fill="#285247" font-family="Lora, Georgia, serif" font-size="17" font-style="italic">Optional extended lockup: A happier rhythm for everyday life.</text>

    <g transform="translate(990 104)">
      <circle cx="104" cy="104" r="92" fill="#FFF9F1" stroke="#285247" stroke-width="12"/>
      <text x="37" y="144" fill="#285247" font-family="Nunito Sans, Arial, sans-serif" font-size="102" font-weight="850" letter-spacing="-10">H</text>
      <text x="99" y="144" fill="#E77B68" font-family="Nunito Sans, Arial, sans-serif" font-size="102" font-weight="850" letter-spacing="-8">4</text>
    </g>
    <g transform="translate(1240 126)">
      <circle cx="42" cy="42" r="42" fill="#FFFFFF" stroke="#24332F" stroke-width="7"/>
      <text x="9" y="60" fill="#24332F" font-family="Nunito Sans, Arial, sans-serif" font-size="49" font-weight="850" letter-spacing="-6">H4</text>
      <text x="100" y="35" fill="#24332F" font-family="Nunito Sans, Arial, sans-serif" font-size="15" font-weight="700">ONE COLOR</text>
      <circle cx="42" cy="132" r="42" fill="#24332F"/>
      <text x="9" y="150" fill="#FFFFFF" font-family="Nunito Sans, Arial, sans-serif" font-size="49" font-weight="850" letter-spacing="-6">H4</text>
      <text x="100" y="125" fill="#24332F" font-family="Nunito Sans, Arial, sans-serif" font-size="15" font-weight="700">REVERSED</text>
    </g>
  </g>

  <!-- VERSION 3 -->
  <g transform="translate(80 892)">
    <rect width="1440" height="332" rx="32" fill="#FFF9F1"/>
    <circle cx="58" cy="58" r="29" fill="#77AFC2"/>
    <text x="48" y="69" fill="#FFFFFF" font-family="Nunito Sans, Arial, sans-serif" font-size="30" font-weight="800">3</text>
    <text x="106" y="56" fill="#77AFC2" font-family="Nunito Sans, Arial, sans-serif" font-size="27" font-weight="800">WARM SIGNATURE</text>
    <text x="106" y="83" fill="#24332F" font-family="Nunito Sans, Arial, sans-serif" font-size="16">More personality and pillar color; best if you want a visibly cheerful identity.</text>

    <g transform="translate(94 130)" font-family="Nunito Sans, Arial, sans-serif" font-weight="800" letter-spacing="-3">
      <text x="0" y="78" fill="#285247" font-size="74">H</text>
      <text x="56" y="66" fill="#E77B68" font-size="74">4</text>
      <text x="109" y="78" fill="#285247" font-size="66">HappyLiving</text>
    </g>
    <g transform="translate(98 228)">
      <rect width="105" height="8" rx="4" fill="#F2B84B"/>
      <rect x="113" width="105" height="8" rx="4" fill="#77AFC2"/>
      <rect x="226" width="105" height="8" rx="4" fill="#E77B68"/>
      <rect x="339" width="105" height="8" rx="4" fill="#7FAE74"/>
    </g>
    <text x="98" y="278" fill="#24332F" font-family="Lora, Georgia, serif" font-size="18" font-style="italic">Practical joy for everyday life.</text>

    <g transform="translate(990 104)">
      <circle cx="104" cy="104" r="94" fill="#B8D2C5"/>
      <path d="M40 82Q104 24 168 82" fill="none" stroke="#F2B84B" stroke-width="16" stroke-linecap="round"/>
      <text x="48" y="157" fill="#285247" font-family="Nunito Sans, Arial, sans-serif" font-size="92" font-weight="850" letter-spacing="-9">H</text>
      <text x="101" y="157" fill="#E77B68" font-family="Nunito Sans, Arial, sans-serif" font-size="92" font-weight="850" letter-spacing="-7">4</text>
    </g>
    <g transform="translate(1240 126)">
      <circle cx="42" cy="42" r="42" fill="#FFF9F1" stroke="#285247" stroke-width="6"/>
      <path d="M15 28Q42 7 69 28" fill="none" stroke="#285247" stroke-width="5" stroke-linecap="round"/>
      <text x="10" y="65" fill="#285247" font-family="Nunito Sans, Arial, sans-serif" font-size="43" font-weight="850" letter-spacing="-5">H4</text>
      <text x="100" y="35" fill="#285247" font-family="Nunito Sans, Arial, sans-serif" font-size="15" font-weight="700">ONE COLOR</text>
      <circle cx="42" cy="132" r="42" fill="#285247"/>
      <path d="M15 118Q42 97 69 118" fill="none" stroke="#FFF9F1" stroke-width="5" stroke-linecap="round"/>
      <text x="10" y="155" fill="#FFF9F1" font-family="Nunito Sans, Arial, sans-serif" font-size="43" font-weight="850" letter-spacing="-5">H4</text>
      <text x="100" y="125" fill="#285247" font-family="Nunito Sans, Arial, sans-serif" font-size="15" font-weight="700">REVERSED</text>
