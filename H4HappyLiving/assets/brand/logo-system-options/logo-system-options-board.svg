<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1320" role="img" aria-labelledby="title desc">
  <title id="title">H4HappyLiving coordinated logo system options</title>
  <desc id="desc">Three paired directions for the H4HappyLiving horizontal wordmark and full badge, including one-color and reversed tests.</desc>
  <rect width="1600" height="1320" fill="#24332F"/>
  <text x="86" y="82" fill="#FFF9F1" font-family="Nunito Sans, Arial, sans-serif" font-size="48" font-weight="800">H4HappyLiving logo system</text>
  <text x="88" y="122" fill="#B8D2C5" font-family="Lora, Georgia, serif" font-size="21" font-style="italic">primary horizontal wordmark + full brand badge — no micro mark</text>

  <!-- VERSION 1 -->
  <g transform="translate(80 168)">
    <rect width="1440" height="332" rx="32" fill="#FFF9F1"/>
    <circle cx="58" cy="58" r="29" fill="#285247"/>
    <text x="48" y="69" fill="#FFF9F1" font-family="Nunito Sans, Arial, sans-serif" font-size="30" font-weight="800">1</text>
    <text x="106" y="56" fill="#285247" font-family="Nunito Sans, Arial, sans-serif" font-size="27" font-weight="800">BALANCED CLASSIC</text>
    <text x="106" y="83" fill="#24332F" font-family="Nunito Sans, Arial, sans-serif" font-size="16">Closest to your current thinking; flat, readable, and versatile.</text>

    <g transform="translate(94 122)" font-family="Nunito Sans, Arial, sans-serif" font-weight="800" letter-spacing="-3">
      <text x="0" y="82" fill="#285247" font-size="76">H</text>
      <text x="58" y="69" fill="#E77B68" font-size="76">4</text>
      <text x="112" y="82" fill="#24332F" font-size="68">HappyLiving</text>
    </g>
    <g transform="translate(98 223)">
      <rect width="39" height="8" rx="4" fill="#F2B84B"/>
      <rect x="48" width="39" height="8" rx="4" fill="#77AFC2"/>
      <rect x="96" width="39" height="8" rx="4" fill="#E77B68"/>
      <rect x="144" width="39" height="8" rx="4" fill="#7FAE74"/>
    </g>
    <text x="98" y="276" fill="#285247" font-family="Lora, Georgia, serif" font-size="17" font-style="italic">Optional extended lockup: Practical joy for everyday life.</text>

    <g transform="translate(990 104)">
      <circle cx="104" cy="104" r="92" fill="#FFF9F1" stroke="#285247" stroke-width="10"/>
      <path d="M42 86 104 42l62 44" fill="none" stroke="#F2B84B" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="51" y="157" fill="#285247" font-family="Nunito Sans, Arial, sans-serif" font-size="92" font-weight="850" letter-spacing="-9">H</text>
      <text x="103" y="157" fill="#E77B68" font-family="Nunito Sans, Arial, sans-serif" font-size="92" font-weight="850" letter-spacing="-7">4</text>
    </g>
    <g transform="translate(1240 126)">
      <circle cx="42" cy="42" r="42" fill="#FFF9F1" stroke="#285247" stroke-width="6"/>
      <text x="9" y="60" fill="#285247" font-family="Nunito Sans, Arial, sans-serif" font-size="49" font-weight="850" letter-spacing="-6">H4</text>
      <text x="100" y="35" fill="#285247" font-family="Nunito Sans, Arial, sans-serif" font-size="15" font-weight="700">ONE COLOR</text>
      <circle cx="42" cy="132" r="42" fill="#285247"/>
      <text x="9" y="150" fill="#FFF9F1" font-family="Nunito Sans, Arial, sans-serif" font-size="49" font-weight="850" letter-spacing="-6">H4</text>
      <text x="100" y="125" fill="#285247" font-family="Nunito Sans, Arial, sans-serif" font-size="15" font-weight="700">REVERSED</text>
    </g>
  </g>

  <!-- VERSION 2 -->
  <g transform="translate(80 530)">
    <rect width="1440" height="332" rx="32" fill="#FFFFFF"/>
    <circle cx="58" cy="58" r="29" fill="#E77B68"/>
    <text x="48" y="69" fill="#FFFFFF" font-family="Nunito Sans, Arial, sans-serif" font-size="30" font-weight="800">2</text>
    <text x="106" y="56" fill="#E77B68" font-family="Nunito Sans, Arial, sans-serif" font-size="27" font-weight="800">CLEAN MODERN</text>
    <text x="106" y="83" fill="#24332F" font-family="Nunito Sans, Arial, sans-serif" font-size="16">The simplest and most scalable; removes the literal roof from the badge.</text>

